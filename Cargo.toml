[package]
name = "watchdog"
version = "0.1.0"
authors = ["Kanav Gupta <kanav0610@gmail.com>"]
edition = "2018"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0.208"
serde_json = "1.0.125"
toml = "0.5.11"
reqwest = "0.9.24"
base64 = "0.10.1"
rust-crypto = "0.2.36"
clap = "2.34"
error-chain="0.12.4"
toml_edit="0.1.5"
nix = "0.9.0"

[[ bin ]]
name = "watchdog"
path = "src/main.rs"

[lib]
name = "lib"
path = "src/lib/lib.rs"
